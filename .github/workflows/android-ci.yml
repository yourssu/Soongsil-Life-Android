name: Android CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 프로젝트 검증
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6

      - name: JDK 21 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6

      - name: 소스 컴파일, 단위 테스트 및 린트
        run: >-
          ./gradlew
          :data:compileKotlin
          :app:compileDebugSources
          :app:testDebugUnitTest
          :app:lintDebug
          --no-daemon
          --stacktrace
